services:
  - type: web
    name: laujim-app
    runtime: node
    repo: https://github.com/jimcarlos111278-cloud/laujim-app
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AUTH_TOKEN
        value: laujim laujim
      - key: DATABASE_URL
        fromDatabase:
          name: laujim-db
          property: connectionString
      - key: EDITOR_ENABLED
        value: "false"

  - type: web
    name: laujim-whatsapp-bot
    runtime: node
    repo: https://github.com/jimcarlos111278-cloud/laujim-app
    plan: free
    rootDir: whatsapp-bot
    buildCommand: npm ci
    startCommand: npm start
    numInstances: 1
    disk:
      name: whatsapp-bot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: API_BASE_URL
        value: https://laujim-app.onrender.com/api
      - key: AUTH_TOKEN
        value: laujim laujim
      - key: SESSION_PATH
        value: /var/data/baileys-sessions
      - key: DATA_DIR
        value: /var/data
      - key: BOT_ADMIN_TOKEN
        sync: false
      - key: BOT_PROXY
        sync: false
      - key: NODE_ENV
        value: production

databases:
  - name: laujim-db
    plan: free
    databaseName: laujim
    user: laujim_user
