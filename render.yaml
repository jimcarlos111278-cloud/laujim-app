services:
  - type: web
    name: laujim-app
    runtime: docker
    repo: https://github.com/jimcarlos111278-cloud/laujim-app
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: RENDER_FULL_CHROME
        value: "true"
      - key: CHROME_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: RENDER_CHROME_PROFILE_DIR
        value: /tmp/laujim-chrome-profiles
      # Optional remote-browser failover. Keep the token only in Render.
      - key: BROWSERLESS_TOKEN
        sync: false
      - key: BROWSERLESS_WS_ENDPOINT
        sync: false
      - key: BROWSERLESS_REGION
        value: production-sfo
      # Browserless can solve Turnstile on the water QR flow; this consumes units.
      - key: BROWSERLESS_PROFILES
        value: air-e,water
      - key: BROWSERLESS_STEALTH
        value: "true"
      - key: BROWSERLESS_SOLVE_CAPTCHAS
        value: "true"
      # Configure both values in the Render dashboard; never commit them.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: SERVICES_SCRAPE_INTERVAL_HOURS
        value: "12"
      - key: DATABASE_URL
        # The production database is Aiven. Keep its private URL only in the
        # Render dashboard; the old Render database was deleted/expired.
        sync: false
      - key: AIVEN_DATABASE_URL
        # This independent key bypasses the legacy Blueprint database link.
        sync: false
      - key: EDITOR_ENABLED
        value: "false"
      # Cloud API is the only production WhatsApp channel. Baileys stays disabled.
      - key: AUTO_START_BOT
        value: "false"
      - key: ENABLE_LEGACY_BAILEYS
        value: "false"
      - key: WHATSAPP_CLOUD_ENABLED
        value: "true"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_GRAPH_VERSION
        sync: false
