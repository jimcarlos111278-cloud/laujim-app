services:
  - type: web
    name: laujim-app
    runtime: node
    repo: https://github.com/jimcarlos111278-cloud/laujim-app
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Configure both values in the Render dashboard; never commit them.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: DATABASE_URL
        # The production database is Aiven. Keep its private URL only in the
        # Render dashboard; the old Render database was deleted/expired.
        sync: false
      - key: AIVEN_DATABASE_URL
        # This independent key bypasses the legacy Blueprint database link.
        sync: false
      - key: EDITOR_ENABLED
        value: "false"
      # Cloud API is the only production WhatsApp channel. Baileys stays disabled.
      - key: AUTO_START_BOT
        value: "false"
      - key: ENABLE_LEGACY_BAILEYS
        value: "false"
      - key: WHATSAPP_CLOUD_ENABLED
        value: "false"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_GRAPH_VERSION
        sync: false
