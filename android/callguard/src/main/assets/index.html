<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Laujim CallGuard Dialer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Top Search & Safe-Area Header (Google Phone style) -->
    <header class="app-header">
      <div class="search-pill">
        <button id="btnMenuToggle" class="search-icon-btn" title="Menú">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <input type="text" id="contactSearch" placeholder="Buscar contactos o números..." autocomplete="off">
        <div class="search-actions">
          <div id="dbStatusDot" class="status-indicator connected" title="Laujim DB Conectada"></div>
          <button id="btnSync" class="search-icon-btn" title="Sincronizar">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 11-.57-8.38l5.67-5.67"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Quick Category Chips -->
      <div class="filter-chips">
        <button class="chip active" data-filter="all">Todas</button>
        <button class="chip" data-filter="missed">Perdidas</button>
        <button class="chip" data-filter="tenants">Inquilinos <span id="tenantChipBadge" class="chip-counter">15</span></button>
        <button class="chip" data-filter="blocked">Spam <span id="blockedChipBadge" class="chip-counter hidden">0</span></button>
      </div>
    </header>

    <!-- Default Dialer Promotion Pill (Discrete) -->
    <div id="bannerDefaultDialer" class="default-dialer-pill hidden">
      <span>⭐ Establecer como app de llamadas</span>
      <button id="btnSetDefaultDialer" class="pill-action-btn">Activar</button>
    </div>

    <!-- Main Screens Viewport -->
    <main class="app-main">
      <!-- TAB 1: HISTORIAL / CONTACTOS (Default) -->
      <section id="tabHistory" class="tab-pane active">
        <div id="historyList" class="calls-container">
          <div class="empty-state">Cargando registros...</div>
        </div>
      </section>

      <!-- TAB 2: TECLADO (Keypad con Preview) -->
      <section id="tabKeypad" class="tab-pane">
        <div class="dialer-top">
          <!-- 10-Digit Truecaller Preview Card -->
          <div id="lookupPreview" class="lookup-preview hidden"></div>

          <!-- Matching Contacts Bar -->
          <div id="dialerMatches" class="matches-container hidden"></div>

          <!-- Phone Number Display -->
          <div class="dialer-input-wrap">
            <input type="text" id="phoneInput" class="phone-input" placeholder="" readonly>
            <button id="btnBackspace" class="backspace-btn hidden" title="Borrar">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H7.07L2.4 12l4.66-7H22v14zm-11.59-2L14 13.41 17.59 17 19 15.59 15.41 12 19 8.41 17.59 7 14 10.59 10.41 7 9 8.41 12.59 12 9 15.59z"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Google Phone Style Minimalist Round Keypad -->
        <div class="keypad-grid">
          <div class="keypad-row">
            <button class="key-btn" data-val="1"><span class="digit">1</span><span class="letters">&nbsp;</span></button>
            <button class="key-btn" data-val="2"><span class="digit">2</span><span class="letters">ABC</span></button>
            <button class="key-btn" data-val="3"><span class="digit">3</span><span class="letters">DEF</span></button>
          </div>
          <div class="keypad-row">
            <button class="key-btn" data-val="4"><span class="digit">4</span><span class="letters">GHI</span></button>
            <button class="key-btn" data-val="5"><span class="digit">5</span><span class="letters">JKL</span></button>
            <button class="key-btn" data-val="6"><span class="digit">6</span><span class="letters">MNO</span></button>
          </div>
          <div class="keypad-row">
            <button class="key-btn" data-val="7"><span class="digit">7</span><span class="letters">PQRS</span></button>
            <button class="key-btn" data-val="8"><span class="digit">8</span><span class="letters">TUV</span></button>
            <button class="key-btn" data-val="9"><span class="digit">9</span><span class="letters">WXYZ</span></button>
          </div>
          <div class="keypad-row">
            <button class="key-btn" data-val="*"><span class="digit">*</span><span class="letters">&nbsp;</span></button>
            <button class="key-btn" data-val="0"><span class="digit">0</span><span class="letters">+</span></button>
            <button class="key-btn" data-val="#"><span class="digit">#</span><span class="letters">&nbsp;</span></button>
          </div>
        </div>

        <!-- Call Action Floating Button -->
        <div class="dialer-call-bar">
          <button id="btnCall" class="call-fab" title="Llamar">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="white">
              <path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.02-.24 11.72 11.72 0 003.68.59 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.72 11.72 0 00.59 3.68 1 1 0 01-.24 1.02l-2.23 2.09z"/>
            </svg>
          </button>
        </div>
      </section>

      <!-- TAB 3: AJUSTES (Minimalista) -->
      <section id="tabSettings" class="tab-pane">
        <div class="settings-list">
          <div class="settings-card">
            <div class="settings-item">
              <div class="settings-meta">
                <span class="settings-title">App predeterminada</span>
                <span id="defaultDialerStatusDesc" class="settings-sub">Predeterminada para llamadas</span>
              </div>
              <button id="btnSettingsRoleDialer" class="btn-pill-action">Configurar</button>
            </div>
            <div class="settings-item">
              <div class="settings-meta">
                <span class="settings-title">Filtro de llamadas spam</span>
                <span id="roleStatusDesc" class="settings-sub">Protección activa 24/7</span>
              </div>
              <button id="btnRequestRole" class="btn-pill-action">Activar</button>
            </div>
          </div>

          <div class="settings-card">
            <div class="settings-item">
              <div class="settings-meta">
                <span class="settings-title">Servidor central</span>
                <span class="settings-sub">conjunto-residendial-laujim.duckdns.org</span>
              </div>
            </div>
            <input type="text" id="txtServerUrl" value="https://conjunto-residendial-laujim.duckdns.org" class="settings-input">
            <button id="btnSaveSettings" class="btn-full-save">Guardar servidor</button>
          </div>
        </div>
      </section>
    </main>

    <!-- Bottom Navigation Bar (Google Phone Style with Pill) -->
    <nav class="app-nav">
      <button class="nav-item active" data-tab="tabHistory">
        <div class="nav-pill">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
          </svg>
        </div>
        <span>Principal</span>
      </button>

      <button class="nav-item" data-tab="tabKeypad">
        <div class="nav-pill">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M12 19c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM6 1c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12-8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-6 2c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6 10c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-6-4c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6-2c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-6-4c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
          </svg>
        </div>
        <span>Teclado</span>
      </button>

      <button class="nav-item" data-tab="tabSettings">
        <div class="nav-pill">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
          </svg>
        </div>
        <span>Ajustes</span>
      </button>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
