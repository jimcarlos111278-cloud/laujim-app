// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// OneDrive marks generated Gradle folders as reparse points and can hold them
// open while syncing.  A caller may place only temporary build outputs
// elsewhere without changing the source or the APK contents.
def externalBuildRoot = System.getenv('LAUJIM_ANDROID_BUILD_ROOT')
if (externalBuildRoot) {
    allprojects {
        buildDir = new File(externalBuildRoot, project.name)
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
